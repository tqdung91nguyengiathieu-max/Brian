<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang quản trị - Brian Crypto Việt</title>
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <!-- Bootstraps Decap CMS (Latest patched version to resolve selection range and composition bugs) -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@latest/dist/decap-cms.js"></script>
    <script>
      CMS.registerEditorComponent({
        id: "custom-image-block",
        label: "Ảnh kèm Chú thích & Link",
        fields: [
          { name: "image", label: "Tải ảnh lên", widget: "image" },
          { name: "caption", label: "Ghi chú dưới ảnh (Caption)", widget: "string" },
          { name: "linkText", label: "Tiêu đề link đọc thêm (để trống nếu không dùng)", widget: "string" },
          { name: "linkUrl", label: "Đường dẫn link đọc thêm (để trống nếu không dùng)", widget: "string" }
        ],
        pattern: /^!\[(.*?)\]\((.*?)\)\n\*(.*?)\*(?:\n\nĐọc thêm: \[(.*?)\]\((.*?)\))?$/m,
        fromBlock: function(match) {
          return {
            caption: match[1],
            image: match[2],
            linkText: match[4] || "",
            linkUrl: match[5] || ""
          };
        },
        toBlock: function(obj) {
          let md = `![${obj.caption}](${obj.image})\n*${obj.caption}*\n\n`;
          if (obj.linkText && obj.linkUrl) {
            md += `Đọc thêm: [${obj.linkText}](${obj.linkUrl})\n\n`;
          }
          return md;
        },
        toPreview: function(obj) {
          let html = `<div style="text-align: center; margin: 20px 0;">\n  <img src="${obj.image}" style="max-width: 100%; border-radius: 8px;" alt="${obj.caption}">\n  <em style="display: block; font-style: italic; color: #64748b; margin-top: 8px; font-size: 14px;">${obj.caption}</em>\n`;
          if (obj.linkText && obj.linkUrl) {
            html += `  <p style="margin-top: 12px; font-size: 16px;">Đọc thêm: <a href="${obj.linkUrl}" style="color: #2563eb; text-decoration: underline;">${obj.linkText}</a></p>\n`;
          }
          html += `</div>`;
          return html;
        }
    </script>
    <script>
      // Prevent Slate.js / Decap CMS editor crash by forcing raw HTML pastes to paste as plain text natively
      let isInterceptingPaste = false;
      document.addEventListener('paste', function(e) {
        // Prevent infinite loop from dispatching the new event
        if (isInterceptingPaste) return;
        
        const activeEl = document.activeElement;
        // Intercept only inside contenteditable editor area
        if (activeEl && activeEl.hasAttribute('contenteditable')) {
          const clipboardData = e.clipboardData || window.clipboardData;
          // If the paste contains rich HTML format (which triggers the crash)
          if (clipboardData && clipboardData.types.includes('text/html')) {
            const text = clipboardData.getData('text/plain');
            if (text) {
              e.preventDefault();
              
              // Create a clean DataTransfer containing ONLY the plain text
              try {
                const dataTransfer = new DataTransfer();
                dataTransfer.setData('text/plain', text);
                
                // Dispatch a new paste event with the plain text data transfer
                isInterceptingPaste = true;
                const newEvent = new ClipboardEvent('paste', {
                  clipboardData: dataTransfer,
                  bubbles: true,
                  cancelable: true
                });
                activeEl.dispatchEvent(newEvent);
                isInterceptingPaste = false;
              } catch (err) {
                console.error("Failed to dispatch clean paste event:", err);
                // Fallback to inserting text if DataTransfer is not supported
                if (document.queryCommandSupported('insertText')) {
                  document.execCommand('insertText', false, text);
                }
              }
            }
          }
        }
      }, true); // Intercept in capturing phase before Slate.js gets it
    </script>
</body>
</html>
