backend:
  name: "git-gateway"
  repo: "tqdung91nguyengiathieu-max/Brian"
  branch: "main"

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "posts"
    label: "Bài viết"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    fields:
      - label: "Tiêu đề"
        name: "title"
        widget: "string"
      - label: "Ngày đăng"
        name: "date"
        widget: "datetime"
      - label: "Chuyên mục"
        name: "category"
        widget: "select"
        options:
          - "Pháp lý"
          - "Người mới"
          - "Chuyên sâu"
          - "Góc nhìn"
      - label: "Ảnh đại diện"
        name: "image"
        widget: "image"
      - label: "Tóm tắt bài viết"
        name: "excerpt"
        widget: "text"
      - label: "Nội dung bài viết"
        name: "body"
        widget: "markdown"

  - name: "videos"
    label: "Danh sách phát Video"
    folder: "content/videos"
    create: true
    slug: "video-{{slug}}"
    format: "json"
    fields:
      - label: "Tiêu đề Video"
        name: "title"
        widget: "string"
      - label: "Mã YouTube ID (ví dụ: dQw4w9WgXcQ)"
        name: "youtubeId"
        widget: "string"
